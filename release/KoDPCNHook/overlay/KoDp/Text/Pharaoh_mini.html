<h1>法老</h1>
<img src="../textures/Lore/Pharaoh~ipad.jpg" align="right" hspace="10" vspace="8"/>
<p class="p1">法老也许是扰乱世界秩序的恶人之一，或者他不过又是一个危险的统治者。他最近凭空出现在我们旧日故土凯瑟拉，从古老的不朽统治者唯一古老者手中窃取了王位。我们逃离了凯瑟拉境内的霍特兰，来到龙之隘口以躲避他的暴政。</p>
