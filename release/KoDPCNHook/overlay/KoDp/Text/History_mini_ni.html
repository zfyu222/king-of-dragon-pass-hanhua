<h1>历史</h1>
<p>自黎明时代以来，我们便生活在历史的世界中，而非神话的世界。各式各样的坏人曾崛起，比如第一纪元试图造出新神的人，或第二纪元试图窥探神明太多奥秘的人。这类人带来巨大苦难，但终将被毁灭。我们如今生活在第三纪元，希望不再有坏人来败坏一切。</p>
