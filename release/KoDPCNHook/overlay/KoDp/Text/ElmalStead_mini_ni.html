<h1>埃尔马尔守护家园</h1>
<p>奥兰斯即将踏上修复混沌破碎的世界的伟大征程，临行前留下他忠诚的侍从埃尔玛，守卫风暴部落的庄园。埃尔玛被敌人击碎多次，但每次都能重塑自身。最终，一个名叫谎言讲述者的存在前来诱惑他。埃尔玛抵抗住了这些诱惑，发现了那生物的隐秘，并从内部将其摧毁。</p>
