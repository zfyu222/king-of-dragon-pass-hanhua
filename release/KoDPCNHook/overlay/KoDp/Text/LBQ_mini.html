<h1>光明使者追寻</h1>
<img src="../textures/Lore/LBQ~ipad.jpg" align="right" hspace="10" vspace="8"/>
<p>一天，奥兰斯发现他的母亲死了，他看到他的父亲在受苦，被锁链锁在大地与天空之间。他发誓要纠正这个可怕的错误，并召唤他的同伴随他一同踏上征程。</p>
<p class="p2"><br></p>
<p>这便是奥兰斯及其同伴所行的旅程。他们的旅程有四个阶段。第一阶段将他们带至世界边缘。第二阶段穿越冥界。第三阶段在冥界最深处的亡者之殿。最后一段则返回东方地平线之上。</p>
<p class="p2"><br></p>

<p>海上旅程</p>

<p>卢阿塞拉</p>
