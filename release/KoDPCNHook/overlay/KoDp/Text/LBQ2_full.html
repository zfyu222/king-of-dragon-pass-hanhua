<h1>海上旅程</h1>
<img src="../textures/Lore/LBQ2~ipad.jpg" align="right" hspace="10" vspace="8"/>
<p>奥兰斯和他的朋友们寻找穿越那片可怜之海的最佳途径——那片海正因混沌之力而垂死崩裂。奥兰斯四处寻求帮助或指引，得到了古老龟祖母索法拉的回应。她欠奥兰斯一份恩惠，于是同意尽力载他们渡海。</p>
<p class="p2"><br></p>
<p>途中，他们遭到一条海龙的袭击，但奥兰斯将其击退。他们又遭到一位神祇的攻击，但查拉娜·阿罗伊治愈了他，他便离开了。一群小怪物试图蜂拥而上，却无法突破伊萨里斯神圣营地的防御。万鱼之王戈洛德试图淹没他们，但尤尔马尔说服了海老人，声称他们是同族。一位女神发起攻击，但兰科·米知道如何引开她。最后，他们抵达了西方之地——卢阿塞拉。</p>
