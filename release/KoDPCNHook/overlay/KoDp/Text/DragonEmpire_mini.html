<h1>屠龙战争</h1>
<img src="../textures/Lore/DragonEmpire~ipad.jpg" align="right" hspace="10" vspace="8"/>
<p class="p1">八百年前，人类与龙族摒弃了古老的敌意，联合建立了龙友帝国。人们割开舌头，以便能说龙语，并学习他们奇异的魔法。</p>
<p class="p2"><br></p>
<p class="p1">帝国曾有强大的敌人，但它因自身的腐化而崩溃。龙人吃掉了邪恶的领袖，所有人都忘记了如何说龙语。</p>
<p class="p2"><br></p>
<p class="p1">四面八方的人们决定进军龙隘，永远消灭龙的威胁。</p>
<p class="p2"><br></p>
<p class="p1">但巨龙只是等着有足够多的人聚在一处，好大吃一顿。它们抖落背上的山峦，起身而起，吃掉了一支百万大军。</p>
<p class="p2"><br></p>
<p class="p1">两百年来，无人敢返回龙隘。</p>
