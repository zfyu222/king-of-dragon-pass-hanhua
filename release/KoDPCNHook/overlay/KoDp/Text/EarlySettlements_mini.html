<h1>早期定居点</h1>
<img src="../textures/Lore/EarlySettlements~ipad.jpg" align="right" hspace="10" vspace="8"/>
<p class="p1">科利马尔和他的氏族是龙杀事件后首批敢于返回龙隘的人类。一代人之后，赫尔特兰的氏族卷入了与法老的内战。那些与法老作战的人失败了，其中许多人作为难民来到了龙隘。他们大多定居在基维尼山峰附近，逐渐被称为基维尼人。</p>
