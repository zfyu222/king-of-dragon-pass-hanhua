<body>
<p>蒲式耳：够一个人吃一年的食物量。“厄尔纳尔达蒲式耳”的简称。</p>
<p class="empty"><br></p>
<p>农夫：耕田并通常照料几头牛的人。</p>
<p class="empty"><br></p>
<p>佃农：下层农夫，通常照料羊群和菜园。</p>
<p class="empty"><br></p>
<p>民兵：氏族军队，主要由武装农夫组成。</p>
<p class="empty"><br></p>
<p>神言者：负责向神献祭的人：祭司。</p>
<p class="empty"><br></p>
<p>海德：土地单位，大致定义为够养活一个家庭的面积。</p>
<p class="empty"><br></p>
<p>萨满：擅长与精魂打交道的人。有时被称为“魂言者”。</p>
<p class="empty"><br></p>
<p>首领：担任领导角色的人，例如一家之主、神谕者或酋长的武器侍从。</p>
<p class="empty"><br></p>
<p>奴隶：没有法律地位的奴隶。</p>
<p class="empty"><br></p>
<p>图拉领地：氏族的家园领土。</p>
<p class="empty"><br></p>
<p>武器侍从：服务于国王或氏族酋长的职业战士。</p>
<p class="empty"><br></p>
<p>氏族灵：一个群体（如氏族或部落）的集体精神。</p>
