<h1>光明使者追寻</h1>
<h2>西行之旅</h2>
<p>一天，奥兰斯发现他的母亲死了，又看到父亲被锁链束缚在天地之间，痛苦不堪。他踏上一场追寻，以纠正这可怕的错误，向西而行。在陆路旅程中，他战胜了许多敌人，并召集了他的同伴：兰科·米、伊萨里斯、查拉娜·阿罗伊，还有血肉之人。奥兰斯甚至还从想要杀死恶作剧者尤尔马尔的人们手中救出了他，并迫使尤尔马尔宣誓效忠。</p>
