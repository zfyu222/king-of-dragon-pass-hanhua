<h1>风暴部落的建立</h1>
<p>埃尔纳尔达催促奥兰斯——他嫉妒皇帝及其火焰部落——创建一个与他们匹敌的部落。奥兰斯克服了种种考验，说服敌对的氏族联合起来，风暴部落由此诞生。</p>
