<h1>兰科尔·姆伊发现真相</h1>
<img src="../textures/Lore/LhankorMhyTruth~ipad.jpg" align="right" hspace="10" vspace="8"/>
<p>在大黑暗时期，真理被扭曲得面目全非，继而丢失。兰科尔·姆伊前往远方寻找它。他在一场竞赛中胜过一位被遗忘之神，并领悟到一种认知，使他能解开所寻之物的扭曲，使之重归为真理。</p>
