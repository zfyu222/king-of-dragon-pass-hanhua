<h1>剑的故事</h1>
<img src="../textures/Lore/SwordStory~ipad.jpg" align="right" hspace="10" vspace="8"/>
<p class="p1">一个名叫尤尔马尔的可悲家伙发现了一种名为“死亡”的新武器，并用它杀害了凡人祖父。他将此物给奥兰斯的兄弟胡玛克特看，胡玛克特便从他手中夺走。尽管胡玛克特试图控制它，但武器的使用仍在扩散，很快杀戮便变得司空见惯。</p>
