<h1>竞赛</h1>
<img src="../textures/Lore/Contests~ipad.jpg" align="right" hspace="10" vspace="8"/>
<p>阿兰特向皇帝耶尔姆发起一系列挑战：一场舞蹈、一场魔法、一场音乐。尽管他的表现胜过耶尔姆，每一次都被守旧的古老神祇驳回。于是众神之战开启。在最后的考验，即战斗的考验中，阿兰特拿起名为“死亡”的新武器，杀死了耶尔姆。</p>
