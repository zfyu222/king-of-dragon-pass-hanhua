<h1>大黑暗</h1>
<p>混沌通过诸神战争、死亡与亲族相残所撕开的裂隙侵入世界。混沌与其冠军——恶魔瓦克博斯——几乎杀尽一切美好之物，并把残存的大部分扭转为堕落与绝望。唯有力量、自我牺牲，以及对创世中最强之神奥兰斯的信仰，才能让人存活。</p>
