<h1>奥兰斯与阿罗卡</h1>
<p>干旱袭击了大地，于是奥兰斯寻找到阿罗卡，一条由水之蓝部落召唤的巨龙。奥兰斯杀死阿罗卡，将雨神海勒尔从龙腹中释放出来。海勒尔随后终结了干旱。</p>
