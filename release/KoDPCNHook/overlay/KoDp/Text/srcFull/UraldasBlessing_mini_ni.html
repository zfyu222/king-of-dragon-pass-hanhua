<h1>尤拉尔达的赐福</h1>
<p>乌拉尔达，群牛之母，发现她的四足子民正遭受噬咬之物的攻击，于是说服他们将自己托付给埃尔纳尔达——两足子民的大地母亲——的保护。四足者获得了安全，两足者则从饥饿中解脱。</p>
