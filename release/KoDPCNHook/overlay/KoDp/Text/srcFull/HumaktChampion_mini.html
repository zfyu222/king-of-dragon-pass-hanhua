<h1>冠军胡马克特</h1>
<img src="../textures/Lore/HumaktChampion~ipad.jpg" align="right" hspace="10" vspace="8"/>
<p>当胡马克特获得名为&quot;死亡&quot;的武器时，他用它斩断了自己与风暴部落的联系。奥兰斯和胡马克特交战，直到奥兰斯在风暴部落中赐予胡马克特一个荣耀的、不同于他旧日地位的位置——冠军之位。胡马克特允许奥兰斯使用那武器。</p>
