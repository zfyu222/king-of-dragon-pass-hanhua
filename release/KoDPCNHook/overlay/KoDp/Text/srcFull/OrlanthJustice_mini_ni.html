<h1>正义使者奥兰斯</h1>
<p>在众神之战期间，连亲族也会彼此争斗。为了寻找新的律法，奥兰斯升入天空，获得了正义魔杖，并用它来平息他子民之间的争端。争端中的失败者与巨魔联手进攻胜利者，奥兰斯则战斗并击败了他。</p>
