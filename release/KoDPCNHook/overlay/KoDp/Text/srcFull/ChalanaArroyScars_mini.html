<h1>查拉娜·阿罗伊治愈伤痕</h1>
<img src="../textures/Lore/ChalanaArroyScars~ipad.jpg" align="right" hspace="10" vspace="8"/>
<p>查拉娜·阿罗伊施行了四大仁慈之举：治愈奥兰斯的嗜血欲，治愈科拉特所患的疾病，说服乌罗克斯不要杀死一位混沌神，以及在死亡之神胡马克特的反对下使赫奥特王复生。</p>
