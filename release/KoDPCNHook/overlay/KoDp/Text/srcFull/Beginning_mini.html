<h1>万物起源</h1>
<img src="../textures/Lore/Beginning~ipad.jpg" align="right" hspace="10" vspace="8"/>
<p>我们的世界格洛兰萨由伟大的力量和四大元素——黑暗、水、大地、火——创造而成。像太阳神耶尔姆这样更亲近凡间的较小神祇统治着格洛兰萨。</p>
<p class="empty"><br></p>
<p>风神乌玛斯为自己在世界中寻得一席之地，风神们搅动了陈腐之地。随后他的儿子奥兰斯挑战耶尔姆，永远改变了格洛兰萨。</p>
